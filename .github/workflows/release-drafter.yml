name: Release Drafter

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter
  cancel-in-progress: true

jobs:
  release-drafter:
    name: Update draft release
    # Computes the next CalVer version (YY.M.N, reusing the current draft's
    # sequence number) and runs release-drafter with it. Reads this repo's
    # .github/release-drafter.yml for the changelog categories.
    uses: esphome/workflows/.github/workflows/draft-calver-release.yml@e1432c7b31fec7d24a13dc192953ebac836ed98a  # 2026.10.3
