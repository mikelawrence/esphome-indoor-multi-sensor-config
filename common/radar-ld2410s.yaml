    minimal_output:
      name: Minimal Output

text_sensor:
  - platform: ld2410s
    fw_version:
      name: LD2410S Firmware version
  - platform: template
    name: "Radar Included"
    id: radar_included
    entity_category: diagnostic
    update_interval: 600s
    lambda: !lambda return {"Hi-Link LD2410S"};
