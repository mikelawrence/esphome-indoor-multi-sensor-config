name: Publish Firmware

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build Firmware
    uses: esphome/workflows/.github/workflows/build.yml@025a1e6255610c498ed590403b7e510b69e474df  # 2026.4.1
    with:
      files: |
        rev-b-pkg-a-none-esp32-s3.factory.yaml
        rev-b-pkg-a-c4001-esp32-s3.factory.yaml
        rev-b-pkg-a-ld2410-esp32-s3.factory.yaml
        rev-b-pkg-a-ld2410s-esp32-s3.factory.yaml
        rev-b-pkg-a-ld2450-esp32-s3.factory.yaml
        rev-b-pkg-b-none-esp32-s3.factory.yaml
        rev-b-pkg-b-c4001-esp32-s3.factory.yaml
        rev-b-pkg-b-ld2410-esp32-s3.factory.yaml
        rev-b-pkg-b-ld2410s-esp32-s3.factory.yaml
        rev-b-pkg-b-ld2450-esp32-s3.factory.yaml
      esphome-version: latest
      release-summary: ${{ github.event.release.body }}
      release-url: ${{ github.event.release.html_url }}
      release-version: ${{ github.event.release.tag_name }}

      
  rewind-pre-release:
    name: Rewind Draft on Build Firmware Failure
    needs: build-firmware
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      contents: write

    steps:
      - uses: ClementTsang/delete-tag-and-release@v0.4.0
        with:
          delete_release: true
          tag_name: ${{ needs.build-firmware.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@025a1e6255610c498ed590403b7e510b69e474df  # 2026.4.1
    needs:
      - build-firmware
    with:
      version: ${{ github.event.release.tag_name }}
      
  promote-pre-release:
    name: Promote Pre-Release to Release
    needs:
      - upload-to-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote Draft to Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ needs.build-firmware.outputs.version }}
          prerelease: false
          makeLatest: true
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}