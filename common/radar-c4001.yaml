# Adds DFRobot C4001 (SEN0609 or SEN0610) mmWave Radar
# Currently this is my PR on ESPHome, there is a new PR from the DFRobot in progress
# Not compatible with any other radar package
substitutions:
  # SEN6X Temperature Compensation values as specific to the C4001 radar module
  sen66_to_offset: "-0.650"
  sen66_to_slope: "-0.040"
  sen66_to_time_constant: "1493"

external_components:
  - source: github://mikelawrence/esphome-component-dfrobot-c4001@${ref}

power_supply:
  # enables power to the C4001 module
  - id: "c4001_enable"
    pin: GPIO15
    enable_on_boot: true

uart:
  - id: c4001_uart
    tx_pin: GPIO18
    rx_pin: GPIO17
    baud_rate: 9600

dfrobot_c4001:
  id: c4001_radar
  uart_id: c4001_uart
  model: SEN0609
  mode: PRESENCE

binary_sensor:
  - platform: template
    # executed every loop() call, about 16 ms
    name: "Presence"
    id: presence
    device_class: presence
    lambda: |-
      id(presence_var) = id(presence_mmwave).state || id(motion_pir).state;
      return id(presence_var);
    on_state:
      then:
        - script.execute: update_status_led
  - platform: dfrobot_c4001
    occupancy:
      name: MMWAVE Presence
      id: presence_mmwave
      filters:
        - delayed_off: !lambda return static_cast<uint32_t>(id(timeout).state * 1000);
    config_changed:
      id: c4001_config_changed
      on_state:
        then:
          - delay: 20s
          - button.press: c4001_config_save
          - logger.log:
              format: "Auto Save C4001 config"
              level: DEBUG
  - platform: gpio
    pin: GPIO16
    name: MMWAVE Presence GPIO
    device_class: presence

button:
  - platform: dfrobot_c4001
    config_save:
      id: c4001_config_save
    factory_reset:
      name: C4001 Factory Reset
    restart:
      name: C4001 Restart

number:
  - id: !extend timeout
    on_value:
      then:
        - number.set:
            id: timeout_c4001
            value: !lambda return static_cast<float>(id(timeout).state);
  - platform: dfrobot_c4001
    dfrobot_c4001_id: c4001_radar
    max_range:
      name: Range Max
      id: max_range
      unit_of_measurement: m
    min_range:
      name: Range Min
      id: min_range
      unit_of_measurement: m
    trigger_range:
      name: Range Trigger
      id:
      unit_of_measurement: m
    hold_sensitivity:
      name: Sensitivity Hold
      id: trigger_range
    trigger_sensitivity:
      name: Sensitivity Trigger
      id: trigger_sensitivity
    on_latency:
      name: Latency On
      id: on_latency
    off_latency:
      id: timeout_c4001
      entity_category: ""
    inhibit_time:
      name: Inhibit Time
      id: inhibit_time

switch:
  - platform: dfrobot_c4001
    dfrobot_c4001_id: c4001_radar
    out_led_enable:
      name: C4001 Enable OUT LED
    run_led_enable:
      name: C4001 Enable RUN LED

text_sensor:
  - platform: dfrobot_c4001
    dfrobot_c4001_id: c4001_radar
    software_version:
      name: C4001 Software Version
    hardware_version:
      name: C4001 Hardware Version
  - platform: template
    name: "Radar Included"
    id: radar_included
    entity_category: diagnostic
    update_interval: 600s
    lambda: !lambda return {"DFRobot C4001"};
