# PACKAGE B
#   Adds SHT45 sensors:
#     Temperature and Humidity
#   Not compatible with PACKAGE A package
external_components:
  - source: github://pr#17422
    components: [sensor]
    refresh: 1h

number:
  - platform: template
    name: "Temperature Cal Offset"
    id: temperature_calibration_offset
    device_class: temperature
    entity_category: config
    optimistic: true
    max_value: 10.0
    min_value: -10.0
    step: 0.01
    initial_value: 0.0
    mode: box
    restore_value: true

sensor:
  - platform: sht4x
    id: sht4x_sensor
    i2c_id: i2c1_bus
    update_interval: 1s
    temperature:
      # temperature_internal has 1s interval averaged to once a minute
      id: temperature_internal
      accuracy_decimals: 2
      filters:
        - filter_out: NAN
        - offset: !lambda return id(temperature_calibration_offset).state;
        - throttle_average: 60s
    humidity:
      # humidity_internal has 1s interval averaged to once a minute
      id: humidity_internal
      accuracy_decimals: 2
      filters:
        - filter_out: NAN
        - rh_correction:
            # use averaged temperature for humidity correction
            sensor_id: temperature
            temperature_offset: !lambda return id(temperature_calibration_offset).state;
        - throttle_average: 60s
  - platform: copy
    # temperature median over last 5 minutes, output every minute
    id: temperature
    name: "Temperature"
    source_id: temperature_internal
    accuracy_decimals: 2
    filters:
      - median:
          window_size: 5
          send_every: 1
  - platform: copy
    # humidity median over last 5 minutes, output every minute
    id: humidity
    name: "Humidity"
    source_id: humidity_internal
    accuracy_decimals: 2
    filters:
      - median:
          window_size: 5
          send_every: 1
