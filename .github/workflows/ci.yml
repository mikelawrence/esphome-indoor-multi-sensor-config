name: CI

on:
  pull_request:
    paths:
      - '*.yaml'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: "0 0 * * 0"   # Weekly on Sunday at midnight


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: Building ${{ matrix.file }} / ${{ matrix.esphome-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        #### Modify below here to match your project ####
        file:
          - rev-b-pkg-a-none-esp32-s3
          - rev-b-pkg-a-c4001-esp32-s3
          - rev-b-pkg-a-ld2410-esp32-s3
          - rev-b-pkg-a-ld2410s-esp32-s3
          - rev-b-pkg-a-ld2450-esp32-s3
          - rev-b-pkg-b-none-esp32-s3
          - rev-b-pkg-b-c4001-esp32-s3
          - rev-b-pkg-b-ld2410-esp32-s3
          - rev-b-pkg-b-ld2410s-esp32-s3
          - rev-b-pkg-b-ld2450-esp32-s3
        #### Modify above here to match your project ####

        esphome-version:
          - stable
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: ESPHome ${{ matrix.esphome-version }}
        uses: esphome/build-action@4ef4722a2935eac47b7e227fe0e1f8e0f8afcc42  # v7.3.0
        with:
          yaml-file: ${{ matrix.file }}.yaml
          version: ${{ matrix.esphome-version }}
          substitutions: |
            ref=${{ github.event.pull_request.head.sha || github.sha }}
      - name: ESPHome ${{ matrix.esphome-version }} Factory
        uses: esphome/build-action@4ef4722a2935eac47b7e227fe0e1f8e0f8afcc42  # v7.3.0
        with:
          yaml-file: ${{ matrix.file }}.factory.yaml
          version: ${{ matrix.esphome-version }}
          substitutions: |
            ref=${{ github.event.pull_request.head.sha || github.sha }}
