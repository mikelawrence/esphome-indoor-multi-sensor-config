name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.yaml"
      - "**.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.yaml"
      - "**.yml"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Building ${{ matrix.file }} / ${{ matrix.esphome-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.esphome-version == 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        #### Modify below here to match your project ####
        file:
          - multi-sensor-pkga-none-esp32-s3
          - multi-sensor-pkga-c4001-esp32-s3
          - multi-sensor-pkga-ld2410-esp32-s3
          - multi-sensor-pkga-ld2410s-esp32-s3
          - multi-sensor-pkga-ld2450-esp32-s3
          - multi-sensor-pkgb-none-esp32-s3
          - multi-sensor-pkgb-c4001-esp32-s3
          - multi-sensor-pkgb-ld2410-esp32-s3
          - multi-sensor-pkgb-ld2410s-esp32-s3
          - multi-sensor-pkgb-ld2450-esp32-s3
        #### Modify above here to match your project ####

        esphome-version: >-
          ${{ github.event_name == 'schedule'
              && fromJSON('["stable","dev"]')
              || fromJSON('["stable"]') }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: ESPHome ${{ matrix.esphome-version }}
        uses: esphome/build-action@6b9d3f593d626a2f0d2c17daebf0a97957d67425  # v8.0.0
        with:
          yaml-file: ${{ matrix.file }}.yaml
          version: ${{ matrix.esphome-version }}
          substitutions: |
            ref=${{ github.event.pull_request.head.sha || github.sha }}

      - name: ESPHome ${{ matrix.esphome-version }} Factory
        uses: esphome/build-action@6b9d3f593d626a2f0d2c17daebf0a97957d67425  # v8.0.0
        with:
          yaml-file: ${{ matrix.file }}.factory.yaml
          version: ${{ matrix.esphome-version }}
          substitutions: |
            ref=${{ github.event.pull_request.head.sha || github.sha }}
