# Adds Hi-Link LD2410S mmWave Radar
#   Not compatible with any other radar package
external_components:
  - source:
      type: git
      url: https://github.com/mikelawrence/esphome-components
    components: [ld2410s]

uart:
  - id: ld2410s_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 115200
    parity: NONE
    stop_bits: 1

ld2410s:
  uart_id: ld2410s_uart

binary_sensor:
  - platform: ld2410s
    has_target:
      name: MMWAVE Presence
      id: presence_mmwave
      filters:
        - settle: 1s
        - delayed_off: !lambda return static_cast<uint32_t>(id(timeout).state * 1000);
    cal_running:
      name: LD2410S Cal Running
      entity_category: diagnostic

button:
  - platform: ld2410s
    cal_start:
      name: LD2410S Cal Start
      entity_category: config

number:
  - platform: template
    # This is the common name across all radars for the delay off style timeout
    name: "Timeout"
    id: timeout
    optimistic: true
    initial_value: 60
    min_value: 1
    max_value: 3600
    mode: box
    step: 1
    restore_value: true
    unit_of_measurement: s
    entity_category: config
  - platform: ld2410s
    max_detect_gate:
      name: Max Detect Gate
    min_detect_gate:
      name: Min Detect Gate
    no_delay:
      name: No Detect Report Delay
    status_reporting_frequency:
      id: status_reporting_frequency
      on_value_range:
        above: 2
        below: 2
        then:
          - number.set:
              id: distance_reporting_frequency
              value: 2
    distance_reporting_frequency:
      id: distance_reporting_frequency
      on_value_range:
        above: 2
        below: 2
        then:
          - number.set:
              id: distance_reporting_frequency
              value: 1
    g0:
      trigger_threshold:
        name: G0 Trigger Threshold
      hold_threshold:
        name: G0 Hold Threshold
    g1:
      trigger_threshold:
        name: G1 Trigger Threshold
      hold_threshold:
        name: G1 Hold Threshold
    g2:
      trigger_threshold:
        name: G2 Trigger Threshold
      hold_threshold:
        name: G2 Hold Threshold
    g3:
      trigger_threshold:
        name: G3 Trigger Threshold
      hold_threshold:
        name: G3 Hold Threshold
    g4:
      trigger_threshold:
        name: G4 Trigger Threshold
      hold_threshold:
        name: G4 Hold Threshold
    g5:
      trigger_threshold:
        name: G5 Trigger Threshold
      hold_threshold:
        name: G5 Hold Threshold
    g6:
      trigger_threshold:
        name: G6 Trigger Threshold
      hold_threshold:
        name: G6 Hold Threshold
    g7:
      trigger_threshold:
        name: G7 Trigger Threshold
      hold_threshold:
        name: G7 Hold Threshold
    g8:
      trigger_threshold:
        name: G8 Trigger Threshold
      hold_threshold:
        name: G8 Hold Threshold
    g9:
      trigger_threshold:
        name: G9 Trigger Threshold
      hold_threshold:
        name: G9 Hold Threshold
    g10:
      trigger_threshold:
        name: G10 Trigger Threshold
      hold_threshold:
        name: G10 Hold Threshold
    g11:
      trigger_threshold:
        name: G11 Trigger Threshold
      hold_threshold:
        name: G11 Hold Threshold
    g12:
      trigger_threshold:
        name: G12 Trigger Threshold
      hold_threshold:
        name: G12 Hold Threshold
    g13:
      trigger_threshold:
        name: G13 Trigger Threshold
      hold_threshold:
        name: G13 Hold Threshold
    g14:
      trigger_threshold:
        name: G14 Trigger Threshold
      hold_threshold:
        name: G14 Hold Threshold
    g15:
      trigger_threshold:
        name: G15 Trigger Threshold
      hold_threshold:
        name: G15 Hold Threshold

sensor:
  - platform: ld2410s
    target_distance:
      name: Target Distance
      filters:
        - throttle_with_priority:
            timeout: 1s
            value:
              - nan
              - 0.0
